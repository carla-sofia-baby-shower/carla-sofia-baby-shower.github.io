<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a8001e">
  <title>Administración · Baby Shower de Carla Sofía</title>
  <style>
    :root{--wine:#a8001e;--rose:#d46382;--pale:#fff6f7;--cream:#fffaf8;--ink:#654149;--muted:#98727b;--line:#ebc3cd}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#fffafb,#f3e3e8 60%,#ead6dd);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    .shell{width:min(100% - 28px,1050px);margin:0 auto;padding:36px 0 70px}.header{display:flex;align-items:center;gap:16px;margin-bottom:24px}.berry{width:58px;height:66px;flex:none}
    h1{margin:0;color:var(--wine);font:700 clamp(2rem,6vw,3.1rem)/1 Georgia,serif}.subtitle{margin:8px 0 0;color:var(--muted)}
    .card{background:rgba(255,250,248,.97);border:1px solid var(--line);border-radius:25px;box-shadow:0 16px 42px rgba(101,0,25,.1);padding:25px}.login{max-width:520px;margin:45px auto}
    label{display:block;margin:0 0 9px;font-weight:800}input,button{font:inherit}input{width:100%;height:56px;padding:0 16px;border:1.5px solid var(--line);border-radius:15px;background:#fff;color:var(--ink)}input:focus{outline:0;border-color:var(--rose);box-shadow:0 0 0 4px rgba(212,99,130,.14)}button{border:0;cursor:pointer}
    .primary{width:100%;min-height:58px;margin-top:16px;border-radius:16px;background:linear-gradient(135deg,var(--wine),#cb496d);color:#fff;font-weight:900;box-shadow:0 10px 24px rgba(168,0,30,.2)}.error{display:none;margin:14px 0 0;color:#a31530;font-weight:700}.error.show{display:block}
    .dashboard{display:none}.dashboard.show{display:block}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}.toolbar input{flex:1;min-width:220px}.secondary{padding:0 17px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--wine);font-weight:800}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:18px;border-radius:19px;background:#fff;border:1px solid #efd3da}.stat span{display:block;color:var(--muted);font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.stat strong{display:block;margin-top:5px;color:var(--wine);font:700 2rem Georgia,serif}
    .rows{display:grid;gap:12px}.row{padding:19px;border-radius:19px;background:#fff;border:1px solid #efd3da}.row-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.name{font-weight:900;font-size:1.06rem;color:#633b45}.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:.78rem;font-weight:900;white-space:nowrap}.yes{background:#edf8e7;color:#4f782e}.no{background:#f9e5ea;color:#9d2642}.meta{margin:7px 0 0;color:var(--muted);font-size:.84rem}.guests{margin:13px 0 0;padding:12px 14px;border-radius:13px;background:var(--pale);line-height:1.55}.row-actions{display:flex;justify-content:flex-end;margin-top:12px}.delete{padding:8px 11px;border-radius:10px;background:#fff0f2;color:#a31530;font-weight:800}.empty,.loading{padding:38px;text-align:center;color:var(--muted)}.back{display:inline-block;margin-top:20px;color:var(--wine);font-weight:800;text-decoration:none}
    @media(max-width:650px){.shell{width:min(100% - 20px,1050px);padding-top:22px}.header{align-items:flex-start}.berry{width:46px;height:54px}.stats{grid-template-columns:1fr}.toolbar{display:grid}.secondary{height:50px}.card{padding:18px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="header">
    <svg class="berry" viewBox="0 0 64 76" aria-hidden="true"><path d="M32 17C16 4 3 14 6 31c3 18 18 35 26 42 8-7 23-24 26-42 3-17-10-27-26-14z" fill="#c90028"/><path d="M32 17 20 4l2 15L8 13l13 14 11-10 10 10 14-14-14 6 2-15z" fill="#75a947"/><g fill="#ffe49a"><ellipse cx="19" cy="33" rx="2" ry="4"/><ellipse cx="32" cy="29" rx="2" ry="4"/><ellipse cx="45" cy="33" rx="2" ry="4"/><ellipse cx="25" cy="48" rx="2" ry="4"/><ellipse cx="39" cy="48" rx="2" ry="4"/></g></svg>
    <div><h1>Lista de invitados</h1><p class="subtitle">Baby shower de Carla Sofía · Panel privado</p></div>
  </header>

  <section id="login" class="card login">
    <label for="password">Contraseña de administración</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Escribe la contraseña">
    <button id="login-btn" class="primary">Entrar al panel</button>
    <p id="login-error" class="error">Contraseña incorrecta o no fue posible entrar.</p>
    <a class="back" href="../">← Volver a la invitación</a>
  </section>

  <section id="dashboard" class="dashboard">
    <div class="stats">
      <div class="stat"><span>Confirmaciones</span><strong id="confirmed">0</strong></div>
      <div class="stat"><span>Personas que asistirán</span><strong id="people">0</strong></div>
      <div class="stat"><span>No asistirán</span><strong id="declined">0</strong></div>
    </div>
    <div class="card">
      <div class="toolbar"><input id="search" type="search" placeholder="Buscar por nombre o invitado"><button id="refresh" class="secondary">Actualizar</button><button id="csv" class="secondary">Descargar CSV</button></div>
      <div id="rows" class="rows"><div class="loading">Cargando confirmaciones…</div></div>
    </div>
    <a class="back" href="../">← Ver la invitación</a>
  </section>
</main>
<script>
const API_URL='https://doiuahyhiinpcokjvmlk.supabase.co/functions/v1/baby-shower-rsvp';
let adminPassword='';let allRows=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(method='GET',id=''){
  const url=API_URL+'/admin'+(id?'?id='+encodeURIComponent(id):'');
  const r=await fetch(url,{method,headers:{'X-Admin-Password':adminPassword}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'No se pudo completar la operación.');return d;
}
function render(){
  const term=$('#search').value.trim().toLocaleLowerCase('es-MX');
  const rows=allRows.filter(r=>!term||[r.full_name,...(r.guests||[])].join(' ').toLocaleLowerCase('es-MX').includes(term));
  $('#confirmed').textContent=allRows.filter(r=>r.attendance==='yes').length;
  $('#people').textContent=allRows.filter(r=>r.attendance==='yes').reduce((n,r)=>n+1+(r.guests||[]).length,0);
  $('#declined').textContent=allRows.filter(r=>r.attendance==='no').length;
  $('#rows').innerHTML=rows.length?rows.map(r=>`<article class="row"><div class="row-head"><div><div class="name">${esc(r.full_name)}</div><div class="meta">${new Date(r.created_at).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}</div></div><span class="badge ${r.attendance==='yes'?'yes':'no'}">${r.attendance==='yes'?'Sí asistirá':'No asistirá'}</span></div>${r.attendance==='yes'?`<div class="guests"><strong>Invitados (${(r.guests||[]).length}):</strong> ${(r.guests||[]).length?(r.guests||[]).map(esc).join(', '):'Sin invitados'}</div>`:''}<div class="row-actions"><button class="delete" data-id="${r.id}">Eliminar</button></div></article>`).join(''):'<div class="empty">No hay confirmaciones que mostrar.</div>';
  document.querySelectorAll('.delete').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('¿Eliminar esta confirmación?'))return;b.disabled=true;try{await api('DELETE',b.dataset.id);allRows=allRows.filter(r=>r.id!==b.dataset.id);render();}catch(e){alert(e.message);b.disabled=false;}}));
}
async function load(){
  $('#rows').innerHTML='<div class="loading">Cargando confirmaciones…</div>';
  const d=await api();allRows=d.rsvps||[];render();
}
$('#login-btn').addEventListener('click',async()=>{adminPassword=$('#password').value;$('#login-error').classList.remove('show');try{await load();$('#login').style.display='none';$('#dashboard').classList.add('show');}catch{$('#login-error').classList.add('show');}});
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#login-btn').click();});
$('#search').addEventListener('input',render);$('#refresh').addEventListener('click',load);
$('#csv').addEventListener('click',()=>{const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const lines=[['Nombre','Asistencia','Invitados','Fecha'],...allRows.map(r=>[r.full_name,r.attendance==='yes'?'Sí':'No',(r.guests||[]).join(', '),new Date(r.created_at).toLocaleString('es-MX')])].map(row=>row.map(q).join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='confirmaciones-carla-sofia.csv';a.click();URL.revokeObjectURL(a.href);});
</script>
</body>
</html>
